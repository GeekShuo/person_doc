<style>

  footer{text-align:center;color:var(--sub);font-size:12.5px;margin-top:36px}

  .link{stroke:#9aa4bb;stroke-opacity:.65}
  .link.adv{stroke:#e05252;stroke-dasharray:5,4;stroke-opacity:.8}

</head>

function barRows(r){
  const defs=[['T+SSR','tssr','var(--tssr)'],['T+Raw','traw','var(--traw)'],['S+SSR','sssr','var(--sssr)'],['S+Raw','sraw','var(--sraw)']];
  return defs.map(([lab,k,c])=>{
    const v=r[k];
    return `<div class="bar-row"><span>${lab}</span><div class="bar-track"><div class="bar-fill" style="width:${v==null?0:v}%;background:${c}"></div></div><span class="val">${v==null?'—':v+'%'}</span></div>`;
  }).join('');
}

/* D3 力导向子图可视化 */
DATASETS.forEach(ds=>{
  const svg=d3.select('#g-'+ds.id), W=420,H=300;
  const nodes=ds.graph.nodes.map(n=>({...n})), links=ds.graph.links.map(l=>({...l}));
  const gAll=svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.5,2.5]).on('zoom',e=>gAll.attr('transform',e.transform)));
  const sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.adv?95:75).strength(d=>d.adv?0.5:1))
    .force('charge',d3.forceManyBody().strength(-260))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collide',d3.forceCollide().radius(22));
  const link=gAll.selectAll('line').data(links).join('line')
    .attr('class',d=>d.adv?'link adv':'link').attr('stroke-width',1.6);
  const linkLabel=gAll.selectAll('text.lrel').data(links).join('text')
    .attr('class','node-label').attr('text-anchor','middle')
    .text(d=>d.rel||'');
  const node=gAll.selectAll('g').data(nodes).join('g')
    .attr('cursor','grab').call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
      .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
  node.append('circle').attr('r',d=>d.type==='target'?16:10)
    .attr('fill',d=>ds.colors[d.type]).attr('stroke','#fff').attr('stroke-width',2);
  node.append('text').attr('class','node-label').attr('dy',d=>d.type==='target'?28:20)
    .attr('text-anchor','middle').text(d=>d.label);
  sim.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    linkLabel.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2-4);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
  const tgt=nodes.find(n=>n.type==='target');
  if(tgt){tgt.fx=W/2;tgt.fy=H/2;}
});
