  <text x="388" y="89" font-size="10" fill="#a0aec0">PDF / 图片 / 扫描件 / 字段</text>

  <rect x="365" y="100" width="145" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <use href="#pdfIcon" x="377" y="105"/>
