      <line x1="17" y1="6.5" x2="26" y2="6.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="17" y1="11.5" x2="26" y2="11.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="17" y1="16.5" x2="23" y2="16.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
