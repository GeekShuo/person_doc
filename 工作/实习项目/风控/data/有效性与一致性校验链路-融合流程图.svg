      <line x1="11" y1="6.5" x2="25" y2="6.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="6" cy="12" r="1.6" fill="#ffffff"/>
      <line x1="11" y1="12" x2="25" y2="12" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="6" cy="17.5" r="1.6" fill="#ffffff"/>
      <line x1="11" y1="17.5" x2="25" y2="17.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
